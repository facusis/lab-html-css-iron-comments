<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <title> Iron Comments </title>

   <link rel="stylesheet" type="text/css" href="./styles/style.css">
</head>

<body>

   <form id="form-container" class="form">
      <fieldset class="fieldset">
         <label for="name" >Name: </label>
         <input type="text" id="name" name="name" required>

         <label for="email">Email: </label>
         <input type="email" id="email" email="email" required>

         <label for="comment">Comment: </label>
         <textarea name="userComment" id="comment" cols="21" rows="8"></textarea>

         <label for="checkbox" class="italic">Recieve email updates? </label>
         <input type="checkbox"> 

         <button class="button">Submit</button>
      </fieldset>
   </form>
</body>

</html>
